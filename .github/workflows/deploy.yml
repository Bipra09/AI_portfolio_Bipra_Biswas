name: Deploy Friday AI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 🧪 Test Backend
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd friday-ai-backend
          npm install

      - name: Run backend tests
        run: |
          cd friday-ai-backend
          npm test || echo "No tests found, skipping..."


  # 🌐 Build and Deploy Frontend (Static Site)
  build-frontend:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repo structure (for debugging)
        run: |
          echo "=== Repo root listing ==="
          ls -la
          echo "=== friday-ai-frontend listing (if exists) ==="
          ls -la friday-ai-frontend || true

      # ✅ FIXED: Copy static site files correctly
      - name: Prepare static frontend files
        run: |
          echo "Preparing static frontend files for GitHub Pages..."
          mkdir -p dist

          if [ -f "friday-ai-frontend/index.html" ]; then
            echo "Detected friday-ai-frontend/index.html — copying that folder."
            cp -r friday-ai-frontend/* dist/
          else
            echo "No friday-ai-frontend detected — copying root static site files."

            # Copy everything from repo root except backend, .github, and dist itself
            rsync -av \
              --exclude='.git*' \
              --exclude='.github' \
              --exclude='friday-ai-backend' \
              --exclude='dist' \
              --exclude='node_modules' \
              ./ dist/
          fi

          echo "✅ Files copied. Dist contents:"
          ls -la dist

      - name: Verify index.html exists
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ ERROR: index.html not found in dist/"
            echo "Dist folder contents:"
            ls -la dist
            exit 1
          else
            echo "✅ index.html found in dist — ready for deployment"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  # 🚀 Deploy Frontend to GitHub Pages
  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ⚙️ Deploy Backend to Vercel
  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd friday-ai-backend
          npm install

      - name: Deploy backend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: ./friday-ai-backend
          vercel-args: '--prod --confirm'
