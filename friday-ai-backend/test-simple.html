<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday AI API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 3px; white-space: pre-wrap; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>🧪 Friday AI API Test</h1>
    
    <div class="test-section">
        <h3>1️⃣ Health Check</h3>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <div id="health-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>2️⃣ AI Chat Test</h3>
        <input type="text" id="question" placeholder="Enter your question" value="Hello! Can you introduce yourself?" style="width: 300px; padding: 8px;">
        <button onclick="testAI()">Ask AI</button>
        <div id="ai-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>3️⃣ Embedding Test</h3>
        <input type="text" id="embed-text" placeholder="Enter text for embedding" value="This is a test sentence." style="width: 300px; padding: 8px;">
        <button onclick="testEmbedding()">Generate Embedding</button>
        <div id="embed-result" class="result"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:3000';

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.textContent = 'Testing...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(`${BASE_URL}/api/health`);
                const data = await response.json();
                resultDiv.textContent = `✅ Success: ${JSON.stringify(data, null, 2)}`;
                resultDiv.className = 'result success';
            } catch (error) {
                resultDiv.textContent = `❌ Error: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        async function testAI() {
            const question = document.getElementById('question').value;
            const resultDiv = document.getElementById('ai-result');
            resultDiv.textContent = 'Testing...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(`${BASE_URL}/api/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.textContent = `✅ AI Response: ${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'result success';
                } else {
                    const errorText = await response.text();
                    resultDiv.textContent = `❌ Error ${response.status}: ${errorText}`;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.textContent = `❌ Error: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        async function testEmbedding() {
            const text = document.getElementById('embed-text').value;
            const resultDiv = document.getElementById('embed-result');
            resultDiv.textContent = 'Testing...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(`${BASE_URL}/api/embed`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.textContent = `✅ Embedding: ${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'result success';
                } else {
                    const errorText = await response.text();
                    resultDiv.textContent = `❌ Error ${response.status}: ${errorText}`;
                    resultDiv.className = 'result error';
                }
            } catch (error) {
                resultDiv.textContent = `❌ Error: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        // Auto-test health on page load
        window.onload = testHealth;
    </script>
</body>
</html>
